# WSword for Windows 10/11 x64. From 0.3.0 the PC build is pc/: Savage Wind Recomp (MIT) with WSword's changes
# (pc/WSWORD.md, docs/BUILD-windows.md), built with MSYS2 UCRT64's clang as Savage Wind's release is. The zip holds no
# game code and no game files: the configuration screen builds the game code on the player's PC from their own files,
# with the frozen generator (swgen/) and the bundled zig. Started by hand with a release tag, the zip is also published
# as a GitHub release.
name: Build Windows

on:
  push:
    branches: [main, 'pc-*']
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the zip as a GitHub release with this tag (e.g. v0.3.10-pc.1); empty: none"
        required: false
        default: ""
      release_notes:
        description: "The release notes, a Markdown file in the repository (e.g. docs/releases/pc-0.3.10-pc.1.md)"
        required: false
        default: ""
      tune:
        description: "A build for one CPU: its -march (e.g. alderlake); empty: the normal build for every PC (pc/Makefile TUNE)"
        required: false
        default: ""
      edition:
        description: "With tune: the build's name in its version and zip (e.g. i7-12700KF); empty: the tune"
        required: false
        default: ""

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write  # (the release, when asked for)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      # the generator helper is frozen from a python.org CPython (its capstone / unicorn / lz4 wheels)
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git curl tar xz diffutils zip unzip
          pacboy: clang:p lld:p binutils:p sdl3:p ffmpeg:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p
            vulkan-memory-allocator:p nasm:p zlib:p
      # (the LGPL FFmpeg: the root's tools/build_deps_windows.sh, the same as pc/'s - its cache kept from 0.2.8-pc.x)
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: deps-win-${{ hashFiles('tools/build_deps_windows.sh') }}
      - name: Deps (LGPL FFmpeg for the game's movies)
        run: |
          make deps-windows
          mkdir -p pc/build && rm -rf pc/build/deps-win && cp -R build/deps-win pc/build/deps-win
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      # (WSword) NVIDIA DLSS's bridge, wsword_dlss.dll (pc/tools/dlss_bridge): MSVC against NVIDIA's DLSS SDK - its
      # headers, the NGX static library and its licence only (no nvngx_dlss.dll: the player's own)
      - name: NVIDIA DLSS SDK
        shell: pwsh
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git pc/build/dlss-sdk
          git -C pc/build/dlss-sdk sparse-checkout set --no-cone '/include/' '/lib/Windows_x86_64/x64/nvsdk_ngx_s.lib' '/LICENSE.txt'
          git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git pc/build/vulkan-headers
          git -C pc/build/dlss-sdk log -1 --format='DLSS SDK %h %s'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # (WSword) NVIDIA DLSS frame generation: NVIDIA's Streamline SDK release (https://github.com/NVIDIA-RTX/Streamline,
      # MIT; its signed production DLLs) - its headers for the bridge, and the interposer and the plugins frame generation
      # needs for the zip's streamline folder (no nvngx_dlssg.dll: the player's own)
      - name: NVIDIA Streamline SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = 'v2.14.16'
          $names = gh release view $v -R NVIDIA-RTX/Streamline --json assets -q '.assets[].name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Streamline $v assets:"; $names
          # (the x64 package: the release also has aarch64 and arm64ec ones)
          $pick = @($names | Where-Object { $_ -like '*.zip' -and $_ -notmatch 'symbol|pdb|debug|source|aarch64|arm64' })
          if (-not $pick) { Write-Error 'no SDK zip in the release'; exit 1 }
          New-Item -ItemType Directory -Force pc/build/sl-dl, pc/build/streamline, pc/build/sl-include | Out-Null
          $found = $null
          foreach ($n in $pick) {
            gh release download $v -R NVIDIA-RTX/Streamline -p $n -D pc/build/sl-dl --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $d = "pc/build/sl-x/" + [IO.Path]::GetFileNameWithoutExtension($n)
            Expand-Archive -Force "pc/build/sl-dl/$n" $d
            $i = Get-ChildItem $d -Recurse -Filter sl.interposer.dll | Where-Object { $_.DirectoryName -match '[\\/]bin[\\/]x64$' } |
                 Select-Object -First 1
            if ($i) { $found = $i; $root = $d; break }
          }
          if (-not $found) { Write-Error 'no production x64 sl.interposer.dll (bin\x64) in the release'; exit 1 }
          $bin = $found.DirectoryName
          Write-Output "binaries: $bin"; Get-ChildItem $bin | Format-Table Name, Length
          foreach ($f in 'sl.interposer.dll', 'sl.common.dll', 'sl.dlss_g.dll', 'sl.reflex.dll', 'sl.pcl.dll') {
            if (-not (Test-Path "$bin/$f")) { Write-Error "missing $f"; exit 1 }
            Copy-Item "$bin/$f" pc/build/streamline/
          }
          foreach ($f in 'NvLowLatencyVk.dll') { if (Test-Path "$bin/$f") { Copy-Item "$bin/$f" pc/build/streamline/ } }
          $inc = (Get-ChildItem $root -Recurse -Filter sl.h | Select-Object -First 1).DirectoryName
          Copy-Item "$inc/*" pc/build/sl-include/ -Recurse
          # (Streamline's own licences and Reflex's: not the nvngx ones - no nvngx DLL ships, and DLSS's is NVIDIA-DLSS-LICENSE.txt)
          foreach ($l in 'license.txt', '3rd-party-licenses.md') {
            $p = Get-ChildItem $root -File -Recurse -Depth 2 -Filter $l | Select-Object -First 1
            if ($p) { Copy-Item $p.FullName "pc/build/streamline/Streamline-$l" }
          }
          if (Test-Path "$bin/reflex.license.txt") { Copy-Item "$bin/reflex.license.txt" pc/build/streamline/Streamline-reflex.license.txt }
          Get-ChildItem pc/build/streamline | Format-Table Name, Length
          if (-not (Get-ChildItem pc/build/streamline -Filter 'Streamline-*licen*')) {  # (the repository's, then)
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA-RTX/Streamline.git pc/build/sl-repo
            git -C pc/build/sl-repo sparse-checkout set --no-cone '/license.txt' '/3rd-party-licenses.md'
            Copy-Item pc/build/sl-repo/license.txt pc/build/streamline/Streamline-license.txt
            Copy-Item pc/build/sl-repo/3rd-party-licenses.md pc/build/streamline/Streamline-3rd-party-licenses.md -ErrorAction SilentlyContinue
          }
      - name: wsword_dlss.dll (MSVC)
        shell: pwsh
        working-directory: pc
        run: |
          # (the x64 MSVC environment for this step alone: vcvars64 - nothing of it reaches the MSYS2 steps)
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cl = 'cl /nologo /O2 /MT /EHsc /LD /std:c++17 /W3 /I build\dlss-sdk\include /I build\vulkan-headers\include ' +
                '/I build\sl-include /I third_party\reshade\include tools\dlss_bridge\wsword_dlss.cpp ' +
                'tools\dlss_bridge\wsword_sl.cpp tools\dlss_bridge\wsword_reshade.cpp ' +
                '/Fe:build\wsword_dlss.dll /Fo:build\ ' +
                '/link build\dlss-sdk\lib\Windows_x86_64\x64\nvsdk_ngx_s.lib advapi32.lib user32.lib shell32.lib ' +
                'ole32.lib version.lib setupapi.lib cfgmgr32.lib gdi32.lib wintrust.lib crypt32.lib'
          $bat = "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul`r`n$cl`r`nif errorlevel 1 exit /b 1`r`n" +
                 "dumpbin /nologo /exports build\wsword_dlss.dll`r`n"
          Set-Content -Path build\dlss_build.bat -Value $bat -Encoding ascii
          cmd /c build\dlss_build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Game code generator helper
        working-directory: pc
        run: make gen-helper GEN_PY="$(cygpath -u '${{ steps.py.outputs.python-path }}')"
      - name: Compiler for the player's PC
        working-directory: pc
        run: tools/fetch_zig.sh
      - name: Release zip
        working-directory: pc
        env:
          TUNE: ${{ inputs.tune }}
          EDITION_IN: ${{ inputs.edition }}
        run: make -j"$(nproc)" dist ${TUNE:+TUNE="$TUNE"} ${EDITION_IN:+EDITION="$EDITION_IN"}
      - name: Nothing of the game inside, WSword's names
        working-directory: pc
        run: |
          D=build/dist/WSword
          bad=$(find "$D" -type d \( -name extracted -o -name 'generated*' -o -name exefs -o -name romfs \);
                find "$D" -name '*.c' ! -path '*/zig/lib/*' ! -path '*/gamelib-src/gamelib_entry.c'; find "$D" -iname 'swgame*'
                find "$D" -iname 'botwgame*'; find "$D" -iname 'Lossless*.dll'; find "$D" -iname 'splash*'; find "$D" -iname 'nvngx*'; find "$D" -iname 'ReShade*.dll')
          [ -z "$bad" ] || { echo "::error::must not ship: $bad"; exit 1; }
          for f in WSword.exe WSword.dll.a "WSword Configuration.exe" LICENSE.txt WSword-PC-guide.md swgen/swgen.exe zig/zig.exe \
                   Inter-Medium.otf Inter-Bold.otf ChakraPetch-Bold.ttf ChakraPetch-OFL.txt launcher-background.png app-icon-forest.png lsfg-vk-LICENSE.md \
                   wsword_dlss.dll NVIDIA-DLSS-LICENSE.txt streamline/sl.interposer.dll streamline/sl.dlss_g.dll \
                   streamline/sl.common.dll streamline/sl.reflex.dll streamline/sl.pcl.dll; do
            [ -e "$D/$f" ] || { echo "::error::missing: $f"; exit 1; }
          done
          # (the game code library imports the runtime from the exe by its name: the import library must name WSword.exe)
          grep -aq 'WSword\.exe' "$D/WSword.dll.a" || { echo "::error::WSword.dll.a doesn't name WSword.exe"; exit 1; }
          ! grep -aqi 'savagewind\.exe' "$D/WSword.dll.a" || { echo "::error::WSword.dll.a names savagewind.exe"; exit 1; }
          ls -la build/dist "$D"
          du -sh "$D"
          echo "::notice title=Zip::$(ls build/dist/*.zip) $(du -m build/dist/*.zip | cut -f1) MB"
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # (the account's artifact storage can be full: the release below doesn't need it)
        with:
          name: WSword-windows
          path: pc/build/dist/*.zip
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      # (workflow_dispatch's release: the zip as a GitHub release from this commit, the notes from the repository's file)
      - name: GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release }}
          NOTES: ${{ inputs.release_notes }}
          TUNE: ${{ inputs.tune }}
        run: |
          $zip = Get-ChildItem pc/build/dist/*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -Encoding ascii "$($zip.FullName).sha256"
          $ver = $zip.Name -replace '^WSword-(.*)-windows\.zip$', '$1'
          if ($env:NOTES -and (Test-Path $env:NOTES)) { $n = @('--notes-file', $env:NOTES) } else { $n = @('--notes', "WSword $ver for Windows.") }
          # (a build for one CPU: a pre-release, so it isn't the latest release that everyone is pointed to)
          if ($env:TUNE) { $n += '--prerelease'; $t = "WSword $ver - PC (Windows, built for one CPU)" } else { $t = "WSword $ver - PC (Windows)" }
          gh release create $env:TAG $zip.FullName "$($zip.FullName).sha256" --target $env:GITHUB_SHA --title $t @n
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $url = gh release view $env:TAG --json url --jq .url
          echo "::notice title=Release::$url"
