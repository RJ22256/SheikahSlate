# WSword for Windows 10/11 x64 (the PC build: Makefile, docs/BUILD-windows.md): MSYS2 UCRT64 with clang, as LAS Recomp's
# release builds it. The zip holds no game code and no game files: the start screen builds the game code on the
# player's PC from their own files, with the frozen generator (botwgen/) and the bundled zig.
name: Build Windows

on:
  push:
    branches: [main, 'pc-*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      # the generator helper is frozen from a python.org CPython (its capstone / unicorn / lz4 wheels)
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git curl tar xz diffutils zip unzip
          pacboy: clang:p lld:p binutils:p sdl3:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p
            vulkan-memory-allocator:p nasm:p
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: deps-win-${{ hashFiles('tools/build_deps_windows.sh') }}
      - name: Deps (LGPL FFmpeg for the game's movies)
        run: make deps-windows
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Game code generator helper
        run: make gen-helper GEN_PY="$(cygpath -u '${{ steps.py.outputs.python-path }}')"
      - name: Compiler for the player's PC
        run: tools/fetch_zig.sh
      - name: Release zip
        run: make -j"$(nproc)" dist
      - name: Nothing of the game inside
        run: |
          D=build/dist/WSword
          bad=$(find "$D" -type d \( -name extracted -o -name 'generated*' -o -name exefs -o -name romfs \);
                find "$D" -name '*.c' ! -path '*/zig/lib/*' ! -path '*/gamelib-src/gamelib_entry.c'; find "$D" -iname 'botwgame*'
                find "$D" -iname 'Lossless*.dll')
          [ -z "$bad" ] || { echo "::error::must not ship: $bad"; exit 1; }
          ls -la build/dist "$D"
          du -sh "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: WSword-windows
          path: build/dist/*.zip
          if-no-files-found: error
          compression-level: 0
