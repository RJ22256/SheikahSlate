# Builds the Sheikah Slate APK (arm64, for the Galaxy Tab S10 Ultra) on GitHub's Ubuntu runners: the pinned
# dependencies (android/deps/*.sh: SDL3, shaderc, Vulkan headers, FFmpeg, and the on-device game code builder -
# Python for Android, capstone, unicorn, lz4, zig), then the app. No game files are involved: players bring their own.
#
# Signing: every build is signed with the same key, so each APK installs over the last (a different key would mean
# uninstalling first, which deletes the app's data folder - the game files with it). By default that is the key kept
# in this private repository, android/sheikahslate/signing/sheikahslate.jks. Before making the repository public or
# sharing builds, move it to the repository secrets SLATE_KEYSTORE_B64 (the .jks in base64), SLATE_KEYSTORE_PASSWORD,
# SLATE_KEY_ALIAS and SLATE_KEY_PASSWORD (those win when set) and delete the file.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write  # (the symbols branch: Runtime symbols)
    defaults:
      run:
        shell: bash  # (bash -eo pipefail: a failing build piped into tee still fails its step)
    env:
      NDK_VERSION: 30.0.16248370
      CMAKE_VERSION: 3.30.4
    steps:
      - uses: actions/checkout@v5

      - name: libadrenotools (a submodule source archives leave out)
        run: |
          git clone --recursive --depth 1 https://github.com/bylaws/libadrenotools third_party/libadrenotools
          git -C third_party/libadrenotools log -1 --format='libadrenotools %H %cs'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages (NDK, CMake, platform 36)
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LINUX=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config nasm > /dev/null
          cmake --version | head -1; ninja --version

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Restore the built dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: android/deps/out
          key: deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/deps/*.sh', 'android/gen/**') }}

      - name: Dependencies (SDL3, shaderc, Vulkan headers, volk, VMA, DejaVu)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash android/deps/build_deps.sh 2>&1 | tee "$RUNNER_TEMP/deps.log"

      - name: FFmpeg (the game's movies)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash android/deps/build_ffmpeg.sh 2>&1 | tee "$RUNNER_TEMP/ffmpeg.log"

      - name: On-device game code builder (Python, capstone, unicorn, lz4, zig)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash android/deps/build_gen_deps.sh 2>&1 | tee "$RUNNER_TEMP/gen.log"

      - name: Save the built dependencies (kept even if the app's build fails)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/deps/out
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # The game code built on the tablet carries this id (android/gamelib_id.cmake: a hash of the generator and the
      # headers it is compiled against); an app with another one makes the player build it again - an hour on the
      # tablet. Changing it has to be deliberate: update android/gamelib_id.expected in the same commit.
      - name: Game code id unchanged (no rebuild on the tablet)
        run: |
          printf 'include(${R}/android/gamelib_id.cmake)\nmessage("${GAMELIB_ID}")\n' > "$RUNNER_TEMP/gid.cmake"
          ID=$(cmake -DR="$PWD" -P "$RUNNER_TEMP/gid.cmake" 2>&1 | tail -1)
          WANT=$(head -1 android/gamelib_id.expected)
          echo "game code id $ID (expected $WANT)"
          if [ "$ID" != "$WANT" ]; then
            echo "::error title=Game code id changed::$ID instead of $WANT - installing this build would make the tablet rebuild the game code"
            exit 1
          fi
          echo "::notice title=Game code id::$ID - the game code already built on the tablet stays valid"

      - name: Desktop tests (tablet layout, threaded BC decode, on-tile read shaders, thread sampler, frame pacing, modes)
        run: |
          mkdir -p build
          clang -O1 -Iruntime -o build/test_tablet_layout tools/test_tablet_layout.c -lm
          build/test_tablet_layout
          clang -O1 -Wall -Iruntime/nvn/vulkan -o build/test_display_pacing tools/test_display_pacing.c runtime/nvn/vulkan/display_pacing.c -lm
          build/test_display_pacing
          mkdir -p build/stub/sys
          printf '#define PROP_VALUE_MAX 92\nint __system_property_get(const char *, char *);\n' > build/stub/sys/system_properties.h
          clang -O1 -Wall -D__ANDROID__ -Iruntime -Iandroid/deps/out/include -Ibuild/stub -o build/test_modes tools/test_modes.c runtime/settings.c
          build/test_modes
          python3 tools/test_bc_threads.py
          sudo apt-get install -y -qq glslang-tools >/dev/null
          python3 tools/test_tile_glsl.py "$(command -v glslangValidator)"
          python3 tools/test_thread_sampling.py

      - name: Release signing key
        env:
          KS_B64: ${{ secrets.SLATE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SLATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLATE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SLATE_KEY_PASSWORD }}
          REPO_KS_PASS: "58G3PZOpLlei6mblL7kMjxykXVa_nKio"  # (the password of android/sheikahslate/signing/sheikahslate.jks)
        run: |
          mkdir -p ~/.sheikahslate
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.sheikahslate/release.jks
          else  # (the repository's own key)
            cp android/sheikahslate/signing/sheikahslate.jks ~/.sheikahslate/release.jks
            KS_PASS=$REPO_KS_PASS KEY_PASS=$REPO_KS_PASS KEY_ALIAS=sheikahslate
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$HOME/.sheikahslate/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > ~/.sheikahslate/keystore.properties
          echo "release key: $KEY_ALIAS"

      - name: Build the APK
        working-directory: android/sheikahslate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          ls -la app/build/outputs/apk/release/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Name the APK
        id: apk
        run: |
          V=$(grep -o 'versionName = "[^"]*"' android/sheikahslate/app/build.gradle.kts | cut -d'"' -f2)
          N="SheikahSlate-$V-${GITHUB_SHA::7}.apk"
          cp android/sheikahslate/app/build/outputs/apk/release/app-release.apk "$N"
          sha256sum "$N"
          echo "name=$N" >> "$GITHUB_OUTPUT"

      # (the performance capture's thread samples name libmain.so's places by offset: its symbols, from the unstripped
      # build, to read them by - an artifact of its own, beside the APK)
      - name: Runtime symbols
        continue-on-error: true
        run: |
          L=$(find android/sheikahslate/app/build/intermediates -name libmain.so -path '*arm64-v8a*' -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2)
          NM=$(find "$ANDROID_HOME/ndk" -name llvm-nm -type f | head -1)
          "$NM" --defined-only --numeric-sort --demangle "$L" | awk '$2 ~ /^[tTwW]$/' > libmain-symbols.txt
          echo "::notice title=Runtime symbols::$(wc -l < libmain-symbols.txt) functions from $L"
          # (also as annotations, ~60 KB each - readable through the API where artifact downloads aren't: address
          # without leading zeros, name cut at 48 characters)
          awk '{a=$1; sub(/^0+/, "", a); n=$3; for (i = 4; i <= NF; i++) n = n " " $i; print a " " substr(n, 1, 48)}' \
            libmain-symbols.txt > syms-short.txt
          split -C 60000 -d syms-short.txt syms-part-
          k=0; for f in syms-part-*; do k=$((k+1)); [ $k -le 8 ] || break
            printf '::notice title=libmain symbols %d::%s\n' "$k" "$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"; done

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: libmain-symbols-${{ github.sha }}
          path: libmain-symbols.txt
          retention-days: 30

      # (and onto the branch "symbols", one file a build: libmain-<commit>.txt - git fetch reaches it where artifact
      # downloads and the annotations' 4 KB don't)
      - name: Runtime symbols to the symbols branch
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s libmain-symbols.txt ] || exit 0
          D="$RUNNER_TEMP/symbols"
          rm -rf "$D" && mkdir -p "$D" && cd "$D"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin symbols; then git checkout -q -B symbols FETCH_HEAD; else git checkout -q --orphan symbols; fi
          cp "$GITHUB_WORKSPACE/libmain-symbols.txt" "libmain-${GITHUB_SHA::7}.txt"
          git add "libmain-${GITHUB_SHA::7}.txt"
          git commit -qm "libmain symbols for ${GITHUB_SHA::7}"
          git push -q origin HEAD:symbols
          echo "::notice title=Runtime symbols::branch symbols, libmain-${GITHUB_SHA::7}.txt"

      # (what the build made, as annotations on the run - readable where its logs aren't)
      - name: APK report
        run: |
          BT=$ANDROID_HOME/build-tools/36.0.0
          APK=${{ steps.apk.outputs.name }}
          note() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          note "APK" "$APK, $(du -m "$APK" | cut -f1) MB, sha256 $(sha256sum "$APK" | cut -c1-16)..."
          note "Package" "$("$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code):")"
          note "Manifest" "$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "appCategory|screenOrientation|PROPERTY_COMPAT_ALLOW|resizeableActivity" | sed 's/^ *//' | head -12)"
          note "Native libraries" "$(unzip -l "$APK" | awk '/lib\/arm64-v8a\//{printf "%s (%d KB)\n", $4, $1/1024}' | sed 's#lib/arm64-v8a/##')"
          note "Assets" "$(unzip -l "$APK" | awk '/ assets\//{n++; s+=$1} END {printf "%d files, %d MB", n, s/1048576}')"
          note "Signing" "$("$BT/apksigner" verify --print-certs "$APK" | grep -E "DN:|SHA-256")"
          # (Settings > Look > App icon: the launcher entry is an activity-alias - the original's, with the name the
          # activity had before, enabled; the others there, off; their icons in the APK. No APK without them:
          # tools/check_launcher_entries.py)
          # (aapt2's badging doesn't list aliases as launchable activities: the manifest itself is read)
          LE=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | python3 tools/check_launcher_entries.py) || { echo "::error::$LE"; exit 1; }
          note "Launcher entries" "$LE"
          RS=$("$BT/aapt2" dump resources "$APK")
          for n in "" _midnight _dawn _ancient _forest; do
            echo "$RS" | grep -qE "mipmap/ic_launcher$n( |$)" || { echo "::error::no icon mipmap/ic_launcher$n"; exit 1; }
          done

      - name: Failure report
        if: failure()
        run: |
          f=$(ls -t "$RUNNER_TEMP"/*.log 2>/dev/null | head -1)
          [ -n "$f" ] || exit 0
          printf '::error title=%s::%s\n' "$(basename "$f") (last lines)" "$(tail -40 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30
